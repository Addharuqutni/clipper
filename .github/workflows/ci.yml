name: CI
on:
  push:
    branches: [main]
  pull_request:

# Batalkan run lama pada cabang yang sama: branch-push beruntun tidak perlu
# memboroskan menit CI untuk hasil yang sudah pasti digantikan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'apps/api/**'
              - 'apps/worker-*/**'
              - 'packages/shared/**'
              - 'pyproject.toml'
              - '.github/**'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/**'
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Semua dependensi runtime: mypy memuat plugin pydantic dan pytest
      # mengimpor fastapi/sqlalchemy — tanpa ini job CI tidak mungkin hijau.
      - run: pip install -e ".[all]"
      - run: ruff check apps packages
      - run: mypy apps/api/app packages/shared/src apps/worker-light/worker_light apps/worker-render/worker_render
      - run: pytest
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Lockfile tunggal di root (npm workspaces), bukan per-app.
          cache-dependency-path: package-lock.json
      # Dijalankan dari root karena workspaces meng-hoist node_modules ke sini.
      # `npm ci` inilah yang menegakkan lockfile tunggal: bila ada lockfile
      # bersarang di apps/web, perintah ini gagal.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
